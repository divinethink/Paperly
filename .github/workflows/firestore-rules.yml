name: Firestore rules

# Separate from CI on purpose: runs only when the rules or their test change (saves Actions minutes).
on:
  push:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'firestore-rules-test/**'
      - '.github/workflows/firestore-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        working-directory: firestore-rules-test
        run: npm install --no-audit --no-fund
      - name: Rules unit tests (Firestore emulator)
        working-directory: firestore-rules-test
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --project paperly-rules-test --config ../firebase.json "npm test"
