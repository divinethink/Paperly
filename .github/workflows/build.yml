name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download ktlint and detekt (pinned)
        run: |
          curl -sSL -o ktlint https://github.com/pinterest/ktlint/releases/download/1.7.1/ktlint
          chmod +x ktlint
          curl -sSL -o detekt.jar https://github.com/detekt/detekt/releases/download/v1.23.8/detekt-cli-1.23.8-all.jar

      - name: ktlint
        run: ./ktlint "app/src/**/*.kt" "*.kts" "app/*.kts"

      - name: detekt
        run: java -jar detekt.jar --input app/src/main/java --config config/detekt/detekt.yml --build-upon-default-config

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # needed only to submit the dependency graph (Dependabot security alerts)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # gradle-wrapper না থাকলেও চলবে: Gradle সরাসরি install করা হয়
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
          dependency-graph: generate-and-submit

      # Optional repo secret (P8-A). Absent = build exactly as before (sync shows "not set up").
      # GOOGLE_SERVICES_JSON = contents of app/google-services.json. The debug signing key is the fixed
      # app/paperly-debug.keystore in the repo (see app/build.gradle.kts), so no secret is needed for it.
      - name: Firebase config
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > app/google-services.json; fi

      - name: Check fixed debug key
        run: test -f app/paperly-debug.keystore || echo "::warning::app/paperly-debug.keystore missing - APK signed with a random key, Google sign-in will fail"

      - name: Unit tests + debug APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      # R8/shrink check: the release build (minify + shrinkResources) must at least compile. Unsigned, never shipped.
      - name: Release build (R8 check)
        run: gradle :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: paperly-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
