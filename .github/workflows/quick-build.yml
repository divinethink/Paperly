name: Quick APK

# দ্রুত ডিভাইস-টেস্টের জন্য: শুধু debug APK, কোনো unit test / R8 / lint নয়।
# হাতে চালান (Actions > Quick APK > Run workflow)। পূর্ণ যাচাই = মূল CI (build.yml)।
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.14.3

      - name: Firebase config
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > app/google-services.json; fi

      - name: Debug APK only
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: paperly-quick-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
